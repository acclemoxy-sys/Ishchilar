<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seh hisob</title>
<link rel="stylesheet" href="common.css">
</head><body>
<div class="top"><div><b>Seh hisob</b><small>Qanday ishlatasiz?</small></div></div>
<div class="card"><h4>📱 Bitta telefon</h4><div class="mut">Hamma ma'lumot faqat shu telefonda saqlanadi. Internet kerak emas.</div>
<button style="width:100%;margin-top:10px" onclick="go('local')">Bitta telefonda ishlatish</button></div>
<div class="card"><h4>👔 Admin (seh egasi)</h4><div class="mut">Ishchilarga ish va avans berasiz, ular o'z telefonida ko'radi. Internet kerak.</div>
<button style="width:100%;margin-top:10px" onclick="go('admin')">Admin sifatida kirish</button></div>
<div class="card"><h4>🧵 Ishchi</h4><div class="mut">Admin bergan seh nomi va PIN kod bilan kirasiz.</div>
<button style="width:100%;margin-top:10px" onclick="go('worker')">Ishchi sifatida kirish</button></div>
<script>
function go(m) { localStorage.setItem('seh_mode', m); location.replace(m === 'local' ? 'local.html' : m + '.html'); }
const m = localStorage.getItem('seh_mode') || (localStorage.getItem('seh_db') ? 'local' : null);
if (m) go(m);
</script>
</body></html>
