name: APK yig'ish
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Kutubxonalarni nusxalash
        run: |
          mkdir -p www/lib
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/lib/
      - run: npx cap add android
      - run: npx cap sync android
      - name: Doimiy imzo kaliti (yangilanganda ma'lumot o'chmasligi uchun)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: APK yig'ish
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: seh-hisob-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
